<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e0c0a">
  <meta name="color-scheme" content="dark">
  <title>Game player | Flint and Steel Arcade</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.emulatorjs.org blob: 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.emulatorjs.org; img-src 'self' https://cdn.emulatorjs.org blob: data:; font-src 'self' https://cdn.emulatorjs.org data:; connect-src 'self' https://cdn.emulatorjs.org blob: data:; worker-src 'self' blob: https://cdn.emulatorjs.org; child-src 'self' blob: https://cdn.emulatorjs.org; media-src 'self' blob: data:; frame-src 'self' blob:; base-uri 'none'; object-src 'none'; form-action 'none'">
  <link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin>
  <style>
    html, body { height: 100%; margin: 0; background: #0e0c0a; color: #d2c6b8; }
    body { position: relative; overflow: hidden; font-family: "Source Sans 3", "Segoe UI", sans-serif; }
    #game { width: 100%; height: 100%; }
    .waiting {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .waiting a { color: #ffc56b; }
    body.is-running .waiting { display: none; }
  </style>
</head>
<body>
  <p class="waiting" id="waiting">Open the <a href="/arcade/">arcade</a> to play.</p>
  <div id="game"></div>
  <script src="/arcade/player.js"></script>
</body>
</html>
